
name: 'Terraform-CI-Plan'

on:
  push:
    branches: 
      - '**'

env: 
  AWS_REGION: ap-south-1
  # For now, we will use your existing IAM user credentials stored in GitHub Secrets
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    

    # Removed the 'working-directory: eks' default so it runs in your root folder
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: "1.16.4" 
          terraform_wrapper: true

    # Added caching for Terraform plugins and modules to speed up subsequent runs 
      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -diff
        continue-on-error: true # Changed to true so formatting doesn't fail the build

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        # Updated to use your correct tfvars file
        run: terraform plan -var-file="terraform.tfvars" -input=false